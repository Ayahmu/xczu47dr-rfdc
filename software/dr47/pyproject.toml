[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "47dr-driver"
dynamic = ["version"]
description = "Direct UDP driver for the XCZU47DR (47DR) RFDC playback board"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["XCZU47DR", "RFSoC", "RFDC", "UDP", "waveform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
dr47-network = "dr47.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/Ayahmu/xczu47dr-rfdc"
Documentation = "https://github.com/Ayahmu/xczu47dr-rfdc/tree/xs17-250mhz-sync/docs"

[tool.setuptools]
packages = ["dr47", "dr47.examples"]

# A source install carries the C source of the bulk sender core and compiles
# it on first use (dr47.bulk).  The delivered binary wheels are built from a
# staged copy of this file (software/build_driver_wheels.py) and ship the
# compiled library instead.
[tool.setuptools.package-data]
dr47 = ["_fastsend.c"]

[tool.setuptools.dynamic]
version = {attr = "dr47._version.__version__"}

[tool.setuptools.package-dir]
dr47 = "."
